name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          cp lib/main.dart /tmp/my_code.dart
          flutter create. --project-name phonepad_controller --platforms android
          cp /tmp/my_code.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePad-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
